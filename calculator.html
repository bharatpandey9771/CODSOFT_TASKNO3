
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #c7d2fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator {
      width: 340px;
      max-width: 100%;
      background: #1f2937;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 12px 30px #00000030;
    }

    .calculator h1 {
      color: white;
      text-align: center;
      font-size: 22px;
      margin-bottom: 18px;
    }

    .display {
      width: 100%;
      min-height: 90px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 10px;
      text-align: right;
      padding: 20px 15px;
      font-size: 34px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      min-height: 62px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      background: #374151;
      color: white;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: #4b5563;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #2563eb;
    }

    .operator:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #dc2626;
    }

    .clear:hover {
      background: #b91c1c;
    }

    .equal {
      background: #16a34a;
      grid-row: span 2;
    }

    .equal:hover {
      background: #15803d;
    }

    .zero {
      grid-column: span 2;
    }

    .calculator p {
      color: #d1d5db;
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
    }

    @media (max-width: 400px) {
      .calculator {
        padding: 15px;
      }

      button {
        min-height: 55px;
        font-size: 19px;
      }

      .display {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <main class="calculator">
    <h1>Basic Calculator</h1>

    <!-- Display -->
    <input
      type="text"
      class="display"
      id="display"
      value="0"
      readonly
      aria-label="Calculator display"
    >

    <!-- Calculator Buttons -->
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal()">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>

    <p>Use the buttons or your keyboard to calculate.</p>
  </main>

  <script>
    const display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let waitingForSecondNumber = false;
    let currentInput = "0";
    let expression = "";

    // Update the calculator display
    function updateDisplay() {
      display.value = currentInput;
    }

    // Enter a number
    function appendNumber(number) {
      if (currentInput === "Error") {
        clearDisplay();
      }

      if (waitingForSecondNumber) {
        currentInput = number;
        waitingForSecondNumber = false;
      } else {
        if (currentInput === "0") {
          currentInput = number;
        } else if (currentInput.length < 15) {
          currentInput += number;
        }
      }
      if (operator !== null){
        expression = firstNumber + " " + operator + " " + currentInput;
      } else {
        expression = currentInput;
      }
      display.value = expression;
    }

    // Enter a decimal point
    function appendDecimal() {
      if (currentInput === "Error") {
        clearDisplay();
      }

      if (waitingForSecondNumber) {
        currentInput = "0.";
        waitingForSecondNumber = false;
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }

      updateDisplay();
    }

    // Select an arithmetic operator
    function chooseOperator(nextOperator) {
      if (currentInput === "Error") return;

      const inputValue = Number(currentInput);

      if (operator && !waitingForSecondNumber) {
        const result = performCalculation(
          firstNumber,
          inputValue,
          operator
        );

        if (result === null) {
          showError();
          return;
        }

        currentInput = formatResult(result);
        firstNumber = result;
        updateDisplay();
      } else {
        firstNumber = inputValue;
      }

      operator = nextOperator;
      waitingForSecondNumber = true;
      expression = firstNumber + " " + operator
      display.value =expression;
    }

    // Perform the calculation
    function performCalculation(a, b, op) {
      switch (op) {
        case "+":
          return a + b;

        case "-":
          return a - b;

        case "*":
          return a * b;

        case "/":
          if (b === 0) return null;
          return a / b;

        case "%":
          if (b === 0) return null;
          return a % b;

        default:
          return b;
      }
    }

    // Format numbers to avoid long decimal output
    function formatResult(number) {
      if (!Number.isFinite(number)) {
        return "Error";
      }

      return String(Number(number.toPrecision(12)));
    }

    // Calculate the final result
    function calculate() {
      if (
        operator === null ||
        waitingForSecondNumber ||
        currentInput === "Error"
      ) {
        return;
      }

      const secondNumber = Number(currentInput);
      const result = performCalculation(
        firstNumber,
        secondNumber,
        operator
      );

      if (result === null) {
        showError();
        return;
      }

      currentInput = formatResult(result);
      firstNumber = null;
      operator = null;
      waitingForSecondNumber = true;

      updateDisplay();
    }

    // Clear all values
    function clearDisplay() {
      currentInput = "0";
      firstNumber = null;
      operator = null;
      waitingForSecondNumber = false;
      updateDisplay();
    }

    // Delete the last digit
    function deleteLast() {
      if (currentInput === "Error") {
        clearDisplay();
        return;
      }

      if (waitingForSecondNumber) {
        return;
      }

      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);

        if (currentInput === "-") {
          currentInput = "0";
        }
      } else {
        currentInput = "0";
      }

      updateDisplay();
    }

    // Display an error
    function showError() {
      currentInput = "Error";
      firstNumber = null;
      operator = null;
      waitingForSecondNumber = true;
      updateDisplay();
    }

    // Keyboard support
    document.addEventListener("keydown", function(event) {
      const key = event.key;

      if (key >= "0" && key <= "9") {
        appendNumber(key);
      } else if (key === ".") {
        appendDecimal();
      } else if (["+", "-", "*", "/", "%"].includes(key)) {
        chooseOperator(key);
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
      } else if (key === "Backspace") {
        deleteLast();
      } else if (key === "Escape") {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
